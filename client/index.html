    <!-- GA4 Consent Mode v2: stub síncrono, antes de cualquier script de terceros.
         El script real de gtag.js SOLO se inyecta desde client/src/lib/ga4/client.ts,
         y SOLO si VITE_GA4_MEASUREMENT_ID está configurado (propiedad propia de
         Segolife) — sin fallback a ningún ID ajeno hardcodeado. Sin esa
         variable, GA4 queda inactivo. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Segolife (Fase 6) — PWA/app-like. NOTA: index.html es un único shell
         estático (sin SSR) — no se puede scoped el <title>/OG por ruta a
         nivel de servidor, así que la metadata global de arriba es neutra
         de SEGOLIFE (nunca IE/UVA, nunca marca heredada). El <title> SÍ se
         actualiza dinámicamente en cliente por comunidad (ver
         SegolifeAppShell.tsx, document.title). Iconos son un SVG generado
         (marca de agua "S"), pendiente de sustituir por assets reales de
         diseño cuando existan. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7a3ad1" />
    <link rel="icon" type="image/svg+xml" href="/icons/segolife-icon.svg" />
    <link rel="apple-touch-icon" href="/icons/segolife-icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Segolife" />
  </head>
